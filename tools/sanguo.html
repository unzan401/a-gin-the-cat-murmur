<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>三國志 — 網頁戰略</title>
<style>
/* ─────────── Reset & Variables ─────────── */
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0d1117;--surface:#161b22;--surface2:#21262d;--border:#30363d;
  --text:#e6edf3;--muted:#8b949e;--radius:10px;
  --faction1:#4a90d9;
  --gold:#f0c040;--hp:#e05252;--food:#6cbb6c;--troop:#7ab8f5;
  --topbar-h:52px;
}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;min-height:100vh;-webkit-tap-highlight-color:transparent}
button{cursor:pointer;border:none;border-radius:6px;font-size:14px;padding:0 14px;height:44px;line-height:44px;transition:filter .15s;touch-action:manipulation}
button:active:not(:disabled){filter:brightness(1.2)}
button:disabled{opacity:.4;cursor:not-allowed}
select,input[type=range]{background:var(--surface2);color:var(--text);border:1px solid var(--border);border-radius:6px;padding:4px 8px;font-size:14px;height:44px}
h2{font-size:16px;margin-bottom:8px}
h3{font-size:13px;color:var(--muted);margin-bottom:4px;margin-top:10px}

/* ═══════════════════════════════
   MOBILE-FIRST LAYOUT
   ─ Topbar (fixed top)
   ─ Map area (fills remaining height)
   ─ Bottom sheet (slide-up panel)
   ─ Log bar (hidden on mobile, shown on desktop)
═══════════════════════════════ */

/* Topbar — fixed, full width */
#topbar{
  position:fixed;top:0;left:0;right:0;z-index:50;
  height:var(--topbar-h);
  display:flex;align-items:center;gap:8px;
  padding:0 12px;
  background:var(--surface);
  border-bottom:1px solid var(--border);
}
#topbar .title{font-size:18px;font-weight:700;letter-spacing:.05em;color:var(--gold);white-space:nowrap}
#topbar .faction-badge{padding:2px 8px;border-radius:999px;font-size:11px;font-weight:600;white-space:nowrap}
#phase-info{font-size:11px;color:var(--muted);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#surrender-btn{flex-shrink:0;padding:0 12px;height:36px;line-height:36px;background:#e05252;color:#fff;font-weight:600;font-size:13px;border-radius:8px}
#global-res{display:flex;gap:6px;align-items:center;flex-shrink:0}
.res-chip{display:flex;align-items:center;gap:2px;font-size:12px}
.res-chip .val{font-weight:700;font-size:13px}
#end-turn-btn{flex-shrink:0;padding:0 12px;height:36px;line-height:36px;background:#2f81f7;color:#fff;font-weight:600;font-size:13px;border-radius:8px;position:absolute;top:50px;right:12px}

/* App wrapper — single column, full screen */
#app{display:flex;flex-direction:column;height:100vh;padding-top:var(--topbar-h)}
#app.hidden{display:none}

/* Map area — fills available height above bottom sheet */
#map-area{
  flex:1;
  position:relative;
  overflow:scroll;
  overflow-x:auto;
  overflow-y:auto;
  background:#0a0f1a;
  /* reserve space for bottom sheet handle */
  padding-bottom:56px;
  cursor:grab;
  -webkit-overflow-scrolling:touch;
}
#map-area.panning{cursor:grabbing}
#map-svg{width:1600px;height:1120px;display:block;touch-action:none}

/* Log bar — hidden on mobile (shown via log panel) */
#log-bar{display:none}

/* ─────────── Mobile Log Panel ─────────── */
#log-fab{
  position:fixed;bottom:64px;right:14px;z-index:45;
  width:48px;height:48px;border-radius:50%;
  background:#2f81f7;color:#fff;font-size:20px;
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 4px 16px rgba(0,0,0,.5);
  border:none;line-height:1;padding:0;
}
#log-panel{
  position:fixed;bottom:0;left:0;right:0;z-index:60;
  background:var(--surface);
  border-top:1px solid var(--border);
  border-radius:16px 16px 0 0;
  max-height:60vh;
  display:flex;flex-direction:column;
  transform:translateY(100%);
  transition:transform .28s cubic-bezier(.4,0,.2,1);
}
#log-panel.open{transform:translateY(0)}
#log-panel-head{
  flex-shrink:0;
  height:48px;
  display:flex;align-items:center;justify-content:space-between;
  padding:0 16px;
  border-bottom:1px solid var(--border);
  font-weight:600;font-size:14px;
}
#log-panel-body{flex:1;overflow-y:auto;padding:8px 14px 20px;font-size:12px;color:var(--muted);-webkit-overflow-scrolling:touch}
#log-panel-body div{padding:3px 0;border-bottom:1px solid rgba(255,255,255,.03)}

/* ─────────── Bottom Sheet (city panel) ─────────── */
#sidebar{
  position:fixed;
  bottom:0;left:0;right:0;
  z-index:40;
  background:var(--surface);
  border-top:1px solid var(--border);
  border-radius:16px 16px 0 0;
  display:flex;
  flex-direction:column;
  max-height:72vh;
  transform:translateY(calc(100% - 56px)); /* show only handle */
  transition:transform .28s cubic-bezier(.4,0,.2,1);
}
#sidebar.open{transform:translateY(0)}

/* Drag handle */
#sheet-handle{
  flex-shrink:0;
  height:56px;
  display:flex;align-items:center;justify-content:space-between;
  padding:0 16px;
  cursor:pointer;
  touch-action:none;
  user-select:none;
}
#sheet-handle::before{
  content:'';
  position:absolute;
  left:50%;transform:translateX(-50%);
  top:8px;
  width:36px;height:4px;
  background:var(--border);
  border-radius:2px;
}
#sheet-title{font-size:15px;font-weight:700;color:var(--gold)}
#sheet-close{background:var(--surface2);color:var(--muted);height:32px;line-height:32px;padding:0 10px;font-size:12px;border:1px solid var(--border)}

#city-panel{flex:1;overflow-y:auto;padding:4px 14px 24px;-webkit-overflow-scrolling:touch}
#city-panel h2{color:var(--gold)}

/* ─────────── City panel content ─────────── */
.stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:4px 12px;font-size:13px;margin-bottom:10px}
.stat-row{display:flex;justify-content:space-between;padding:3px 0}
.stat-val{font-weight:600}
.actions{display:flex;flex-direction:column;gap:8px;margin-top:8px}
.actions button{
  text-align:left;
  height:48px;line-height:48px;
  padding:0 14px;
  background:var(--surface2);
  color:var(--text);
  border:1px solid var(--border);
  font-size:13px;
  display:flex;align-items:center;justify-content:space-between;
}
.actions button span{color:var(--muted);font-size:12px}

/* ─────────── Officer card ─────────── */
.officer-list{display:flex;flex-direction:column;gap:6px}
.officer-card{background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:10px 12px;font-size:12px;overflow:hidden}
.officer-card .name{font-weight:700;font-size:14px}
.officer-card .stats{display:flex;gap:4px;margin-top:6px;flex-wrap:wrap;max-width:100%}
.stat-tag{padding:2px 6px;border-radius:999px;font-size:11px;white-space:nowrap}

/* ─────────── Map city touch targets ─────────── */
.city-group{cursor:pointer}
.city-touch{fill:transparent;stroke:none} /* invisible but tappable */
.city-label{font-size:12px;fill:#e6edf3;text-anchor:middle;pointer-events:none;font-weight:700}
.city-pop{font-size:12px;fill:#8b949e;text-anchor:middle;pointer-events:none}
.city-selected .city-bg{stroke:#f0c040 !important;stroke-width:3 !important}

/* ─────────── Modal ─────────── */
#modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.7);display:flex;align-items:flex-end;justify-content:center;z-index:100;padding:0}
#modal-overlay.hidden{display:none}
#modal{
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:16px 16px 0 0;
  padding:24px 20px 32px;
  width:100%;
  max-height:85vh;
  overflow-y:auto;
}
#modal h2{margin-bottom:14px;font-size:18px}
#modal .btn-row{display:flex;gap:10px;margin-top:18px}
#modal .btn-row button{flex:1;height:48px;line-height:48px;font-size:14px}
.btn-confirm{background:#2f81f7;color:#fff}
.btn-cancel{background:var(--surface2);color:var(--text);border:1px solid var(--border)}
input[type=range]{width:100%;height:36px;margin:6px 0}

/* ─────────── Cover for AI turn ─────────── */
#cover{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:250;display:flex;align-items:center;justify-content:center}
#cover.hidden{display:none}

/* ─────────── Start screen ─────────── */
#start-screen{
  position:relative;
  inset:0;
  background:var(--bg);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  z-index:200;
  gap:16px;
  padding:24px 16px;
  overflow-y:auto;
}
#start-screen h1{font-size:clamp(28px,8vw,52px);color:var(--gold);letter-spacing:.08em;text-shadow:0 0 40px rgba(240,192,64,.3);text-align:center}
#start-screen p{color:var(--muted);max-width:480px;text-align:center;line-height:1.7;font-size:14px}
.faction-select{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;width:100%;max-width:600px}
@media(max-width:480px){.faction-select{grid-template-columns:1fr 1fr}}
.faction-btn{
  padding:14px 12px;
  border-radius:12px;
  border:2px solid var(--border);
  background:var(--surface);
  color:var(--text);
  font-size:13px;font-weight:600;
  transition:all .2s;text-align:left;
  height:auto;line-height:1.4;
}
.faction-btn:active{transform:scale(.97)}
.faction-btn .flag{font-size:22px;display:block;margin-bottom:6px}
.faction-btn .desc{font-size:11px;color:var(--muted);font-weight:400;margin-top:4px;display:block}
.faction-btn[data-f]{border-color:var(--border)}

/* ─────────── Win/lose overlay ─────────── */
#result-screen{position:fixed;inset:0;background:rgba(0,0,0,.85);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:300;gap:16px;padding:24px}
#result-screen.hidden{display:none}
#result-screen h2{font-size:clamp(36px,10vw,56px)}
#result-screen p{color:var(--muted);font-size:15px;text-align:center}
#result-screen button{padding:0 32px;height:52px;line-height:52px;background:#2f81f7;color:#fff;font-size:16px;border-radius:10px}

/* ─────────── Battle animation ─────────── */
.flash{animation:flash .3s ease-out}
@keyframes flash{0%{filter:brightness(3)}100%{filter:brightness(1)}}
::-webkit-scrollbar{width:4px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px}

/* ═══════════════════════════════
   DESKTOP (≥640px) — restore side-by-side layout
═══════════════════════════════ */
@media(min-width:640px){
  :root{--topbar-h:48px}
  #app{display:grid;grid-template-columns:1fr 320px;grid-template-rows:1fr auto;padding-top:var(--topbar-h)}
  #topbar{gap:14px}
  #topbar .title{font-size:20px}
  #phase-info{font-size:12px}
  #end-turn-btn{height:36px;line-height:36px}

  #map-area{padding-bottom:0;overflow:auto;cursor:grab}
  #map-area.panning{cursor:grabbing}

  /* Restore sidebar as right panel — fixed height = full viewport minus topbar */
  #sidebar{
    position:sticky;
    top:var(--topbar-h);
    transform:none !important;
    border-radius:0;
    border-top:none;
    border-left:1px solid var(--border);
    max-height:none;
    height:calc(100vh - var(--topbar-h));
    overflow:hidden;
    transition:none;
    display:flex;
    flex-direction:column;
  }
  #sheet-handle{display:none}
  #city-panel{padding:12px 14px 16px}

  /* Restore log bar */
  #log-bar{
    display:block;
    grid-column:1/-1;
    background:var(--surface2);
    border-top:1px solid var(--border);
    padding:6px 16px;
    font-size:12px;
    color:var(--muted);
    height:80px;
    min-height:80px;
    flex-shrink:0;
    overflow-y:auto;
    position:absolute;
    bottom:0;
    left:0;
    right:0;
    z-index:35;
  }

  /* Hide mobile-only log UI on desktop */
  #log-fab{display:none}
  #log-panel{display:none}

  /* Modal as centered dialog on desktop */
  #modal-overlay{align-items:center;padding:0}
  #modal{border-radius:14px;max-width:480px;width:90%;max-height:90vh}
  #modal .btn-row button{flex:none;width:auto;padding:0 20px}
}
</style>
</head>
<body>

<!-- Start Screen -->
<div id="start-screen">
  <h1>⚔ 三國志</h1>
  <p>漢末亂世，群雄並起。選擇你的諸侯，逐鹿天下！</p>
  <div id="faction-select-grid" class="faction-select"></div>
</div>

<!-- Fixed Topbar (all screen sizes) -->
<div id="topbar">
  <span id="faction-badge" class="faction-badge"></span>
  <span id="phase-info"></span>
  <button id="surrender-btn">投降 ⚔</button>
  <div id="global-res">
    <div class="res-chip">💰<span id="res-gold" class="val">0</span></div>
    <div class="res-chip">🌾<span id="res-food" class="val">0</span></div>
    <div class="res-chip">⚔<span id="res-troop" class="val">0</span></div>
  </div>
  <button id="end-turn-btn">結束 ▶</button>
</div>

<!-- Main App -->
<div id="app" class="hidden">
  <!-- Map -->
  <div id="map-area">
    <svg id="map-svg" viewBox="0 0 1400 1020" preserveAspectRatio="xMidYMid meet"></svg>
  </div>

  <!-- Bottom Sheet / Sidebar -->
  <div id="sidebar">
    <div id="sheet-handle" onclick="toggleSheet()">
      <span id="sheet-title">點擊城市查看詳情</span>
      <button id="sheet-close" onclick="event.stopPropagation();closeSheet()">✕ 關閉</button>
    </div>
    <div id="city-panel"></div>
  </div>

  <!-- Log Bar (desktop only) -->
  <div id="log-bar"></div>
</div>

<!-- Modal -->
<div id="modal-overlay" class="hidden">
  <div id="modal">
    <h2 id="modal-title"></h2>
    <div id="modal-body"></div>
    <div class="btn-row">
      <button class="btn-cancel" id="modal-cancel">取消</button>
      <button class="btn-confirm" id="modal-confirm">確認</button>
    </div>
  </div>
</div>
<div id="cover" class="hidden"></div>

<!-- Result Screen -->
<div id="result-screen" class="hidden">
  <h2 id="result-emoji">🎉</h2>
  <h3 id="result-title" style="font-size:24px;color:var(--gold)"></h3>
  <p id="result-desc"></p>
  <button onclick="location.reload()">重新開始</button>
</div>

<!-- Mobile Log FAB -->
<button id="log-fab" onclick="toggleLogPanel()" title="查看記錄">📜</button>

<!-- Mobile Log Panel -->
<div id="log-panel">
  <div id="log-panel-head">
    📜 戰報記錄
    <button onclick="toggleLogPanel()" style="background:var(--surface2);color:var(--muted);border:1px solid var(--border);height:30px;line-height:30px;padding:0 10px;font-size:12px">關閉</button>
  </div>
  <div id="log-panel-body"></div>
</div>

let G = null; // Game state singleton
let selectedCityId = null;
let pendingAction = null;

/* ── 開發度相關 ── */
const TROOP_CAP_PER_DEV = 5;   // 兵力容量 = 基礎值 + 開發 × 5
const AP_BASE = 3;
const AP_BONUS_DEV = 80;       // 開發度達標有額外行動力
const AP_BONUS = 1;
const DEF_PER_DEV = 0.5;   // 每點開發度提供的城防

function calcMaxTroops(c) {
  return c.baseTroopCap + c.development * TROOP_CAP_PER_DEV;
}
function calcDefense(c) {
  return Math.round(c.baseDefense + c.development * DEF_PER_DEV);
}
// 所有改變開發度的地方都用這個，容量與城防才會同步更新
function setDevelopment(c, value) {
  c.development = Math.max(0, Math.min(100, Math.round(value)));
  c.maxTroops = calcMaxTroops(c);
  c.defense   = calcDefense(c);
}
function getMaxAP(cityId) {
  return AP_BASE + (G.cities[cityId].development >= AP_BONUS_DEV ? AP_BONUS : 0);
}

function initGame(playerFaction, difficulty = 0.5) {
  G = {
    turn: 1,
    year: 184,
    month: 1,
    playerFaction,
    difficulty: Math.max(0, Math.min(1, difficulty)),
    phase: 'player',
    cities: {},
    officers: {},
    cityAP: {}, // 每城每回合行動力 { cityId: remaining }
    log: [],
    gameover: false,
  };

  // Init cities
  CITY_DEF.forEach(cd => {
    const owner = Object.entries(FACTIONS).find(([k,v]) => v.cities.includes(cd.id));
    const city = {
      ...cd,
      owner: owner ? owner[0] : 'none',
      gold: cd.pop * 20,
      food: cd.pop * 30,
      troops: cd.pop * 60,
      baseTroopCap: cd.pop * 80,
      maxTroops: 0,
      development: cd.fertile * 8,
      // 讓開局城防仍等於 defBase；之後隨開發度升降
      baseDefense: (cd.defBase ?? (40 + cd.pop * 5)) - cd.fertile * 8 * DEF_PER_DEV,
      defense: 0,
      officers: [],
    };
    setDevelopment(city, city.development);   // 算出 maxTroops
    G.cities[cd.id] = city;
    G.cityAP[cd.id] = getMaxAP(cd.id);
  });

  // 24諸侯各持初始城，無需特殊處理


  // Init officers — assign to their faction's start city
  OFFICER_POOL.forEach(o => {
    const startCity = FACTIONS[o.f]?.startCity || CITY_DEF[Math.floor(Math.random() * CITY_DEF.length)].id; // random;
    G.officers[o.id] = {
      ...o,
      cityId: startCity,
      hp: 100,
      loyalty: 100,
    };
    if (G.cities[startCity]) G.cities[startCity].officers.push(o.id);
  });

  addLog(`── 西元 ${G.year} 年，黃巾之亂爆發，天下大亂！你選擇以【${FACTIONS[playerFaction].name}】${FACTIONS[playerFaction].leader}的身份，逐鹿中原！`);
  addLog(`難度係數 ${G.difficulty.toFixed(1)}：AI 內政效果 ×${(1 + G.difficulty).toFixed(1)}。`);
}

   GAME LOGIC
════════════════════════════════════════════════════════════ */
function getTotalRes(faction) {
  let gold = 0, food = 0, troops = 0;
  Object.values(G.cities).forEach(c => {
    if (c.owner === faction) { gold += c.gold; food += c.food; troops += c.troops; }
  });
  return {gold, food, troops};
}

function getPlayerCities() {
  return Object.values(G.cities).filter(c => c.owner === G.playerFaction);
}

function getAdjacentCities(cityId) {
  const adj = [];
  EDGES.forEach(([a,b]) => {
    if (a === cityId) adj.push(b);
    else if (b === cityId) adj.push(a);
  });
  return adj;
}

function canAttackFrom(cityId) {
  const c = G.cities[cityId];
  return c.owner === G.playerFaction && c.troops >= 500;
}

// Internal politics: raise gold/food/troops
/* ════════════════════════════════════════════════════════════
   SHARED CORE LOGIC — used by both player and AI
════════════════════════════════════════════════════════════ */

/**
 * Apply an internal action (farm / commerce / recruit / develop) to a city.
 * Works for any faction. Returns false if preconditions not met.
 */
function applyInternalAction(cityId, action, silent = false) {
  const c = G.cities[cityId];
  const say = msg => { if (!silent) addLog(msg); };
  // AI 城市：內政效果 × (1 + 難度係數)
  const mult = c.owner === G.playerFaction ? 1 : 1 + (G.difficulty ?? 0);

  const polOfficer   = getBestOfficer(cityId, 'pol');
  const intelOfficer = getBestOfficer(cityId, 'intel');
  const polBonus   = polOfficer   ? 1 + (polOfficer.pol   / 100) * 0.5 : 1;
  const intelBonus = intelOfficer ? 1 + (intelOfficer.intel / 100) * 0.3 : 1;

  if (action === 'farm') {
    const gain = Math.floor((c.development * 4 + 50) * intelBonus * mult);
    c.food += gain;
    const hint = intelOfficer ? `（${intelOfficer.name}督糧）` : '';
    say(`【${c.name}】屯田：獲得 ${gain} 糧草${hint}。`);
  } else if (action === 'commerce') {
    const gain = Math.floor((c.development * 3 + 40) * polBonus * mult);
    c.gold += gain;
    const hint = polOfficer ? `（${polOfficer.name}理政）` : '';
    say(`【${c.name}】徵稅：獲得 ${gain} 金${hint}。`);
  } else if (action === 'recruit') {
    const cost = 200;
    if (c.gold < cost) { say(`【${c.name}】金不足，無法募兵（需 ${cost} 金）。`); return false; }
    if (c.troops >= c.maxTroops) { say(`【${c.name}】兵力已達容量上限（${c.maxTroops}）。`); return false; }
    const gain = Math.floor((100 + c.development * 0.67) * polBonus * mult);
    c.gold -= cost;
    c.troops = Math.max(c.troops, Math.min(c.troops + gain, c.maxTroops));
    const hint = polOfficer ? `（${polOfficer.name}招兵）` : '';
    say(`【${c.name}】募兵：耗 ${cost} 金，獲得 ${gain} 兵${hint}。`);
  } else if (action === 'develop') {
    const cost = 400;
    if (c.gold < cost) { say(`【${c.name}】金不足，無法開發（需 ${cost} 金）。`); return false; }
    c.gold -= cost;
    const devGain = Math.round((polOfficer && polOfficer.pol >= 80 ? 8 : 5) * mult);
    setDevelopment(c, c.development + devGain);
    const hint = polOfficer ? `（${polOfficer.name}規劃）` : '';
    say(`【${c.name}】開發：城市發展度 +${devGain}（現為 ${c.development}，兵力容量 ${c.maxTroops}）${hint}。`);
  }
  return true;
}

/**
 * Resolve a battle between two cities. `attackerFaction` is used for log messages.
 * Returns { victory: bool, atkLoss: number, defLoss: number }
 */
function resolveBattle(fromId, toId, sendTroops, attackerFaction) {
  const atk = G.cities[fromId];
  const def = G.cities[toId];

  const atkCmdr  = getBestOfficer(fromId, 'cmd');
  const defCmdr  = getBestOfficer(toId, 'cmd');
  const atkBonus = atkCmdr ? atkCmdr.cmd / 100 : 0.5;
  const defBonus = defCmdr ? defCmdr.cmd / 100 : 0.5;

  const atkPower = sendTroops * (0.7 + atkBonus * 0.6) * (0.8 + Math.random() * 0.4);
  const defPower = (def.troops + def.defense * 5) * (0.6 + defBonus * 0.5) * (0.8 + Math.random() * 0.4);
    // 戰力比：>1 攻方占優，越大越是碾壓
  const ratio = atkPower / Math.max(1, defPower);
  const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));
  const atkWin = ratio > 1;
// 攻方損失率：碾壓時很低，險勝或落敗時很高（3%~60%）
  const atkLossRate = clamp(0.2 / ratio, 0.03, 0.6);
  // 守方損失率：隨戰力比上升，ratio ≥ 1.25 時守軍全滅（10%~150%）
  const defLossRate = clamp(0.8 * ratio, 0.1, 1.5);
  const atkLoss = Math.min(def.troops + 100, Math.floor(sendTroops * atkLossRate));
  const defLoss = Math.min(def.troops, sendTroops, Math.floor(def.troops * defLossRate));
  const victory = def.troops <= defLoss;

  // 攻城破壞：開發度 -= 出兵數 × 0.02 × 隨機係數
  const devBefore = def.development;
  setDevelopment(def, def.development - Math.floor(sendTroops * 0.02 * Math.random() * clamp(1 / ratio, 0.3, 1)));
  const devLoss = devBefore - def.development;

  const isPlayer = attackerFaction === G.playerFaction;
  const atkName  = isPlayer ? `【${atk.name}】` : `AI【${FACTIONS[attackerFaction]?.name}】`;
  const cmdrStr  = atkCmdr ? `（主將：${atkCmdr.name} 統${atkCmdr.cmd}）` : '';
  const devStr   = devLoss > 0 ? ` 城市開發 -${devLoss}。` : '';

  if (victory) {
    atk.troops -= sendTroops;
    const surviving = Math.max(0, sendTroops - atkLoss);
    def.troops = surviving;
    const prevOwner = def.owner;
    def.owner = attackerFaction;
    G.cityAP[toId] = 1;
    def.officers.forEach(oid => { G.officers[oid].f = attackerFaction; });
    const capStr = (isPlayer && def.officers.length > 0)
      ? '俘虜 ' + def.officers.map(i => G.officers[i].name).join('、') + '！' : '';
    const prevStr = (!isPlayer && prevOwner === G.playerFaction) ? `（原屬 你的城市⚠）` : '';
    addLog(`⚔ ${atkName} 攻克 ${def.name}！${cmdrStr} 損兵 ${atkLoss}，敵損 ${defLoss}。${devStr}${capStr}${prevStr}`);
    flashCity(toId);
    checkWinLose();
  } else {
    atk.troops = Math.max(0, atk.troops - atkLoss);
    def.troops = Math.max(0, def.troops - defLoss);
    addLog(`⚔ ${atkName} 攻打 ${def.name} ${atkWin ? '優勢中' : '失敗'}。${cmdrStr} 損兵 ${atkLoss}，敵損 ${defLoss}。${devStr}`);
  }
  return { victory, atkLoss, defLoss };
}

   PLAYER ACTIONS
════════════════════════════════════════════════════════════ */

function doInternal(cityId, action) {
  const c = G.cities[cityId];
  if (c.owner !== G.playerFaction) return;
  if ((G.cityAP[cityId] ?? 0) < 1) {
    addLog(`【${c.name}】行動力不足（本回合已用盡）。`);
    return;
  }
  if (!applyInternalAction(cityId, action)) return;
  G.cityAP[cityId] = Math.max(0, (G.cityAP[cityId] ?? 0) - 1);
  updateUI();
}

// Transfer troops between adjacent own cities
function promptTransfer(fromId) {
  const from = G.cities[fromId];
  const adjOwn = getAdjacentCities(fromId).filter(id => G.cities[id].owner === G.playerFaction);
  if (adjOwn.length === 0) { addLog(`【${from.name}】無相鄰我方城市可移兵。`); return; }
  if ((G.cityAP[fromId] ?? 0) < 1) { addLog(`【${from.name}】行動力不足。`); return; }

  const maxTroops = Math.max(0, from.troops - 100);   // 至少留守 100
  const inputStyle = 'width:100%;padding:8px;background:var(--surface2);border:1px solid var(--border);color:var(--text);border-radius:6px;font-size:15px;margin-top:6px';
  const field = (id, label, max, val) => `
    <div style="margin-bottom:10px">
      <label style="font-size:13px">${label}（最多 ${max}）</label>
      <input id="${id}" type="number" min="0" max="${max}" step="1" value="${val}" style="${inputStyle}">
    </div>`;

  showModal(
    `🚚 從【${from.name}】移兵`,
    `
    <div style="margin-bottom:10px">
      <label style="font-size:13px">目標城市</label>
      <select id="transfer-target" style="${inputStyle}">
        ${adjOwn.map(tid => `<option value="${tid}">${G.cities[tid].name}（兵 ${G.cities[tid].troops}/${G.cities[tid].maxTroops}）</option>`).join('')}
      </select>
    </div>
    ${field('transfer-troops', '⚔ 兵力', maxTroops, Math.min(500, maxTroops))}
    ${field('transfer-gold',   '💰 金', from.gold, 0)}
    ${field('transfer-food',   '🌾 糧', from.food, 0)}
    <div style="font-size:12px;color:var(--muted)">本城至少留守 100 兵；目標城兵力受容量限制，超出的部分不會移動。</div>
    `,
    () => doTransfer(fromId)
  );
}

function doTransfer(fromId) {
  const from = G.cities[fromId];
  const to   = G.cities[document.getElementById('transfer-target')?.value];
  const read = id => Math.max(0, parseInt(document.getElementById(id)?.value, 10) || 0);
  let troops = read('transfer-troops');
  const gold = read('transfer-gold');
  const food = read('transfer-food');
  const maxTroops = Math.max(0, from.troops - 100);

  if (!to || to.owner !== G.playerFaction) { addLog('移兵目標無效。'); return; }
  if ((G.cityAP[fromId] ?? 0) < 1) { addLog(`【${from.name}】行動力不足。`); return; }
  if (troops > maxTroops) { addLog(`移兵數量無效（最多 ${maxTroops}，需留守 100）。`); return; }
  if (gold > from.gold || food > from.food) { addLog(`【${from.name}】金糧不足。`); return; }

  const space = Math.max(0, to.maxTroops - to.troops);
  if (troops > space) {
    addLog(`【${to.name}】兵力容量只剩 ${space}，移兵數量已調整。`);
    troops = space;
  }
  if (troops + gold + food === 0) { addLog('沒有可移動的兵力或錢糧。'); return; }

  from.troops -= troops; to.troops += troops;
  from.gold   -= gold;   to.gold   += gold;
  from.food   -= food;   to.food   += food;
  G.cityAP[fromId] = Math.max(0, (G.cityAP[fromId] ?? 0) - 1);

  const parts = [];
  if (troops) parts.push(`兵 ${troops}`);
  if (gold)   parts.push(`金 ${gold}`);
  if (food)   parts.push(`糧 ${food}`);
  addLog(`🚚 【${from.name}】向【${to.name}】運送：${parts.join('、')}。`);
  updateUI();
}

// Battle: player attacks target city
function doAttack(fromId, toId, sendTroops) {
  const atk = G.cities[fromId];
  if (atk.troops < sendTroops) { addLog('兵力不足！'); return; }
  if ((G.cityAP[fromId] ?? 0) < 2) {
    addLog(`【${atk.name}】行動力不足，攻城需要 2 點行動力（現剩 ${G.cityAP[fromId] ?? 0}）。`);
    return;
  }
  resolveBattle(fromId, toId, sendTroops, G.playerFaction);
  G.cityAP[fromId] = Math.max(0, (G.cityAP[fromId] ?? 0) - 2);
  updateUI();
}

function getBestOfficer(cityId, stat) {
  const c = G.cities[cityId];
  let best = null;
  c.officers.forEach(oid => {
    const o = G.officers[oid];
    if (!best || o[stat] > best[stat]) best = o;
  });
  return best;
}

// AI turn: simple greedy
function doAITurn() {
  const aiFactions = Object.keys(FACTIONS).filter(f => f !== G.playerFaction);
  aiFactions.forEach(faction => {
    const myCities = Object.values(G.cities).filter(c => c.owner === faction);
    if (myCities.length === 0) return;

    // Try to attack a neighbour if troops sufficient
    myCities.sort((a,b) => b.troops - a.troops);
    
    // Internal actions — use same logic as player
    myCities.forEach(city => {
      if (city.troops >= city.maxTroops * 0.5) {
        tryAttackAdjacent(city);
      }
      applyInternalAction(city.id, 'farm');
      applyInternalAction(city.id, 'commerce');
      if (city.development < 100 && city.gold >= 400) applyInternalAction(city.id, 'develop');
      if (city.troops < city.maxTroops && city.gold >= 200) applyInternalAction(city.id, 'recruit');
    });

    function tryAttackAdjacent(city) {
      const adj = getAdjacentCities(city.id);
      const targets = adj.map(id => G.cities[id]).filter(c => c.owner !== faction);
      if (targets.length === 0) return;

      const target = targets.sort((a,b) => a.troops - b.troops)[0];
      if (!target) return;
      if (city.troops < city.maxTroops && target.troops > city.troops * 0.6) return;
      const sendTroops = Math.floor(city.troops * 0.6);
      resolveBattle(city.id, target.id, sendTroops, faction);
    }
  });
}

function surrender() {
  if (G.gameover) return;
  G.gameover = true;
  showResult(false, `${G.year} 年 ${G.month} 月，你投降了。`);
}
let isEnding = false;
function endTurn() {
  if (G.gameover || isEnding) return;
  isEnding = true;
  // cover the screen when the AI is taking its turn
  document.getElementById('cover').classList.remove('hidden');
  const warnings = [];
  let taxCities = 0;
  let taxTotal = 0;
  getPlayerCities().forEach(c => {
    const ap = G.cityAP[c.id] ?? 0;
    if (ap <= 0) return;
    const before = c.gold;
    for (let i = 0; i < ap; i++) applyInternalAction(c.id, 'commerce', true);
    G.cityAP[c.id] = 0;
    taxCities++; taxTotal += c.gold - before;
  });
  if (taxCities > 0) addLog(`💰 剩餘行動力自動徵稅：${taxCities} 城共獲得 ${taxTotal} 金。`);

  doAITurn();

  // Reset AP for all cities
  Object.keys(G.cityAP).forEach(id => {
    G.cityAP[id] = getMaxAP(id);
  });

  G.month++;
  if (G.month > 12) { G.month = 1; G.year++; }
  G.turn++;
  
  // Monthly income and food/troop upkeep for player cities
  Object.values(G.cities).forEach(c => {
    c.food += Math.floor(c.development * 2 + 20);
    c.gold += Math.floor(c.development * 1.5 + 15);
    // 糧草消耗：兵力越多耗糧越快
    const foodCost = Math.floor(c.troops * 0.2);
    if (c.food >= foodCost) {
      c.food -= foodCost;
    } else {
      // 糧盡兵散：兵力減少 8%
      const troopLoss = Math.floor(c.troops * 0.08);
      c.food = 0;
      c.troops = Math.max(0, c.troops - troopLoss);
      if (troopLoss > 0) warnings.push(`【${c.name}】糧草耗盡！損失 ${troopLoss} 兵（糧盡兵散）。`);
    }
  });
  addLog(`── ${G.year} 年 ${G.month} 月，新回合開始。各城行動力已重置。`);
  warnings.forEach(w => addLog(`⚠ ${w}`));
  updateUI();
  checkWinLose();
  document.getElementById('cover').classList.add('hidden');

  if (!G.gameover) {
    sessionStorage.setItem('gameState', JSON.stringify(G));
  }
  setTimeout(() => { isEnding = false; }, 0);
}

function checkWinLose() {
  if (G.gameover) return;
  const myCities = getPlayerCities().length;
  const totalCities = CITY_DEF.length;
  if (myCities === 0) {
    G.gameover = true;
    showResult(false, `${G.year} 年 ${G.month} 月，你的勢力滅亡了。`);
  } else if (myCities >= totalCities) {
    G.gameover = true;
    showResult(true, `${G.year} 年 ${G.month} 月，你統一了天下！`);
  }
}

const SVG_NS = 'http://www.w3.org/2000/svg';

function getFactionColor(owner) {
  return FACTIONS[owner]?.color || '#555';
}

function buildMap() {
  const svg = document.getElementById('map-svg');
  svg.innerHTML = '';

  // Draw background territories (subtle)
  const defs = document.createElementNS(SVG_NS,'defs');
  svg.appendChild(defs);

  // Edges
  const edgeG = document.createElementNS(SVG_NS,'g');
  EDGES.forEach(([a,b]) => {
    const ca = CITY_DEF.find(c=>c.id===a);
    const cb = CITY_DEF.find(c=>c.id===b);
    if (!ca||!cb) return;
    const line = document.createElementNS(SVG_NS,'line');
    line.setAttribute('x1',ca.x); line.setAttribute('y1',ca.y);
    line.setAttribute('x2',cb.x); line.setAttribute('y2',cb.y);
    line.setAttribute('stroke','#2d333b');
    line.setAttribute('stroke-width','2.5');
    edgeG.appendChild(line);
  });
  svg.appendChild(edgeG);

  // Cities
  CITY_DEF.forEach(cd => {
    const g = document.createElementNS(SVG_NS,'g');
    g.setAttribute('class','city-group');
    g.setAttribute('id','cg-'+cd.id);
    g.setAttribute('transform',`translate(${cd.x},${cd.y})`);
    g.addEventListener('click', () => selectCity(cd.id));

    const city = G.cities[cd.id];
    const color = getFactionColor(city.owner);
    const r = 20 + city.pop * 1.2; // 2x scale for 1600×1120 viewBox
    const touchR = Math.max(r + 8, 28);

    // Shadow
    const shadow = document.createElementNS(SVG_NS,'circle');
    shadow.setAttribute('r', r+3); shadow.setAttribute('fill','rgba(0,0,0,.4)');
    shadow.setAttribute('cy',3);

    const bg = document.createElementNS(SVG_NS,'circle');
    bg.setAttribute('class','city-bg');
    bg.setAttribute('r', r);
    bg.setAttribute('fill', color);
    bg.setAttribute('stroke', '#0d1117');
    bg.setAttribute('stroke-width', '3');
    bg.setAttribute('fill-opacity', '0.85');

    const label = document.createElementNS(SVG_NS,'text');
    label.setAttribute('class','city-label');
    label.setAttribute('y',5);
    label.setAttribute('font-size','14');
    label.textContent = cd.name;

    const troops = document.createElementNS(SVG_NS,'text');
    troops.setAttribute('class','city-pop');
    troops.setAttribute('y', r + 12);
    troops.setAttribute('font-size','12');
    troops.textContent = city.troops;

    // Invisible large touch target (must be last so it's on top)
    const touch = document.createElementNS(SVG_NS,'circle');
    touch.setAttribute('class','city-touch');
    touch.setAttribute('r', touchR);

    g.appendChild(shadow); g.appendChild(bg); g.appendChild(label); g.appendChild(troops); g.appendChild(touch);
    svg.appendChild(g);
  });
}

// ─────────── Map pan/drag ───────────
(function initMapPan() {
  const area = document.getElementById('map-area');
  let dragging = false, moved = false;
  let startX, startY, scrollX, scrollY, pid;

  area.addEventListener('pointerdown', e => {
    if (e.button !== 0) return;
    dragging = true; moved = false;
    pid = e.pointerId;
    startX = e.clientX; startY = e.clientY;
    scrollX = area.scrollLeft; scrollY = area.scrollTop;
    // 這裡不要 setPointerCapture
  });

  area.addEventListener('pointermove', e => {
    if (!dragging || e.pointerId !== pid) return;
    const dx = e.clientX - startX, dy = e.clientY - startY;
    if (!moved && Math.abs(dx) < 5 && Math.abs(dy) < 5) return;

    if (!moved) {                       // 第一次超過門檻才進入拖曳模式
      moved = true;
      area.setPointerCapture(pid);
      area.classList.add('panning');
    }
    area.scrollLeft = scrollX - dx;
    area.scrollTop  = scrollY - dy;
  });

  function end(e) {
    if (e.pointerId !== pid) return;
    dragging = false;
    area.classList.remove('panning');
    if (area.hasPointerCapture(pid)) area.releasePointerCapture(pid);
    // 拖曳後的 click 會在 pointerup 之後同步觸發，
    // 用 setTimeout 在 click 處理完後再重置 moved
    setTimeout(() => { moved = false; }, 0);
  }
  area.addEventListener('pointerup', end);
  area.addEventListener('pointercancel', end);

  // 只吞掉「拖曳後」的那一次 click
  area.addEventListener('click', e => {
    if (moved) { e.stopPropagation(); e.preventDefault(); }
  }, true);
})();

function updateMap() {
  CITY_DEF.forEach(cd => {
    const g = document.getElementById('cg-'+cd.id);
    if (!g) return;
    const city = G.cities[cd.id];
    const color = getFactionColor(city.owner);
    const bg = g.querySelector('.city-bg');
    if (bg) {
      bg.setAttribute('fill', color);
      // 我方城市有剩餘 AP 時，加金色邊框
      if (city.owner === G.playerFaction && (G.cityAP[cd.id] ?? 0) > 0) {
        bg.setAttribute('stroke', '#f0c040');
        bg.setAttribute('stroke-width', '5');
        bg.setAttribute('filter', 'drop-shadow(0 0 8px #f0c04088)');
      } else {
        bg.setAttribute('stroke', '#0d1117');
        bg.setAttribute('stroke-width', '3');
        bg.removeAttribute('filter');
      }
    }
    const troops = g.querySelector('.city-pop');
    if (troops) troops.textContent = city.troops;
    if (cd.id === selectedCityId) g.setAttribute('class','city-group city-selected');
    else g.setAttribute('class','city-group');
  });
}

function flashCity(cityId) {
  const g = document.getElementById('cg-'+cityId);
  if (!g) return;
  g.classList.add('flash');
  setTimeout(() => g.classList.remove('flash'), 400);
}

}

/* ════════════════════════════════════════════════════════════
   UI — Sidebar
════════════════════════════════════════════════════════════ */
function selectCity(cityId) {
  selectedCityId = cityId;
  updateMap();
  renderCityPanel(cityId);
  // Auto-open sheet on mobile
  const title = document.getElementById('sheet-title');
  if (title) title.textContent = G.cities[cityId].name;
  openSheet();
}

function renderCityPanel(cityId) {
  const c = G.cities[cityId];
  const panel = document.getElementById('city-panel');
  const isOwn = c.owner === G.playerFaction;
  const faction = FACTIONS[c.owner];
  const fColor = getFactionColor(c.owner);
  const ap = G.cityAP[cityId] ?? 0;

  const officers = c.officers.map(oid => G.officers[oid]).filter(Boolean);

  panel.innerHTML = `
    <h2 style="color:${fColor}">${c.name}</h2>
    <div style="font-size:12px;color:var(--muted);margin-bottom:8px">
      ${c.region ? `<span style="color:var(--muted)">${c.region}</span> · ` : ''}隸屬：<span style="color:${fColor};font-weight:700">${faction?.name || '無主'}</span>
    </div>
    <div class="stat-grid">
      <div class="stat-row"><span>💰 金</span><span class="stat-val">${c.gold}</span></div>
      <div class="stat-row"><span>🌾 糧</span><span class="stat-val">${c.food}</span></div>
      <div class="stat-row"><span>⚔ 兵</span><span class="stat-val">${c.troops}/${c.maxTroops}</span></div>
      <div class="stat-row"><span>🛡 城防</span><span class="stat-val">${c.defense}</span></div>
      <div class="stat-row"><span>🏗 發展</span><span class="stat-val">${c.development}</span></div>
      ${isOwn ? `<div class="stat-row"><span>⚡ 行動力</span><span class="stat-val" style="color:${ap>0?'var(--gold)':'var(--muted)'}">${ap}/${getMaxAP(cityId)}</span></div>` : ''}
    </div>

    ${isOwn ? `
    <h3>內政 <span style="color:var(--muted);font-size:11px">（每次耗 1 ⚡）</span></h3>
    <div class="actions">
      <button onclick="doInternal('${cityId}','farm')" ${ap<1?'disabled':''}>🌾 屯田 <span>+${Math.floor(c.development*4+50)} 糧</span></button>
      <button onclick="doInternal('${cityId}','commerce')" ${ap<1?'disabled':''}>💰 徵稅 <span>+${Math.floor(c.development*3+40)} 金</span></button>
      <button onclick="doInternal('${cityId}','recruit')" ${(ap<1||c.gold<200 || c.troops>=c.maxTroops)?'disabled':''}>⚔ 募兵 <span>-200金 +兵</span></button>
      <button onclick="doInternal('${cityId}','develop')" ${(ap<1||c.gold<400 || c.development>=100)?'disabled':''}>🏗 開發 <span>-400金 +發展</span></button>
    </div>
    <h3 style="margin-top:10px">軍事 <span style="color:var(--muted);font-size:11px">（攻城耗 2 ⚡，移兵耗 1 ⚡）</span></h3>
    <div class="actions">
      ${getAdjacentCities(cityId).filter(id=>G.cities[id].owner!==G.playerFaction).map(tid=>`
        <button onclick="promptAttack('${cityId}','${tid}')" ${(c.troops<200||ap<2)?'disabled':''}>⚔ 攻 ${G.cities[tid].name} <span style="color:${getFactionColor(G.cities[tid].owner)}">${FACTIONS[G.cities[tid].owner]?.name||'無主'}</span></button>
      `).join('')}
      ${getAdjacentCities(cityId).filter(id=>G.cities[id].owner!==G.playerFaction).length===0 ? '<div style="color:var(--muted);font-size:11px;padding:4px">無相鄰敵城</div>' : ''}
      <button onclick="promptTransfer('${cityId}')" ${(c.troops<=100||ap<1)?'disabled':''}>🚚 移兵／運補 <span>可帶金糧</span></button>
    </div>
    ` : `
    <h3>敵方情報</h3>
    <div style="font-size:12px;color:var(--muted)">攻克此城需要強大的兵力，當前兵力：${c.troops}</div>
    <h3 style="margin-top:10px">攻打（從相鄰城市）</h3>
    <div class="actions">
      ${getAdjacentCities(cityId).filter(id=>G.cities[id].owner===G.playerFaction && G.cities[id].troops>=200).map(fid=>`
        <button onclick="promptAttack('${fid}','${cityId}')" ${(G.cityAP[fid]??0)<2?'disabled':''}>⚔ 從 ${G.cities[fid].name} 攻打 <span style="color:var(--muted)">${G.cityAP[fid]??0}⚡</span></button>
      `).join('')}
      ${getAdjacentCities(cityId).filter(id=>G.cities[id].owner===G.playerFaction).length===0 ? '<div style="color:var(--muted);font-size:11px;padding:4px">無相鄰我方城市</div>' : ''}
    </div>
    `}

    <h3 style="margin-top:12px">駐守武將（${officers.length} 人）</h3>
    <div class="officer-list">
      ${officers.length === 0 ? '<div style="color:var(--muted);font-size:11px">（無武將）</div>' : ''}
      ${officers.map(o=>`
        <div class="officer-card">
          <div class="name">${o.name}</div>
          <div class="stats">
            <span class="stat-tag" style="background:#1a3a5c;color:#7ab8f5" title="統率：影響攻守戰力">統${o.cmd}</span>
            <span class="stat-tag" style="background:#3a1a1a;color:#f07070" title="武力：影響單兵戰鬥">武${o.force}</span>
            <span class="stat-tag" style="background:#1a3a1a;color:#70d070" title="智力：影響屯田效率">智${o.intel}</span>
            <span class="stat-tag" style="background:#3a2a1a;color:#f0c040" title="政治：影響徵稅/募兵/開發">政${o.pol}</span>
            <span class="stat-tag" style="background:#2a1a3a;color:#c07aff" title="魅力：影響外交">魅${o.cha}</span>
          </div>
          <div style="font-size:10px;color:var(--muted);margin-top:4px">
            統率加成戰力 +${Math.floor(o.cmd*0.6)}%・政治加成內政 +${Math.floor(o.pol*0.5)}%
          </div>
        </div>
      `).join('')}
    </div>
    <h3 style="margin-top:12px">歷史戰報</h3>
    <button style="margin-top:8px" onclick="checkHistory('${cityId}')">查看</button>
  `;
}

function checkHistory(cityId) {
    const cityName = G.cities[cityId].name;
    const history = [];
    for (let index = G.log.length - 1; index >= 0 && history.length < 10; index--) {
        const log = G.log[index];
        if (log.includes(cityName)) {
            history.push(log);
        }
    }
    showModal(
        '歷史戰報',
        `
            ${history.map(log => `
                <div style="font-size:14px;margin-bottom:12px;line-height:1.7">
                    ${log}
                </div>
            `).join('')}
        `,
        () => {}
    );
}

function updateTopBar() {
  const res = getTotalRes(G.playerFaction);
  document.getElementById('res-gold').textContent = res.gold;
  // 糧草不足警示：計算總耗糧量
  const totalFoodCost = getPlayerCities().reduce((s,c) => s + Math.floor(c.troops * 0.2), 0);
  const foodEl = document.getElementById('res-food');
  foodEl.textContent = res.food;
  foodEl.style.color = res.food < totalFoodCost ? '#e05252' : '';
  document.getElementById('res-troop').textContent = res.troops;

  const fb = document.getElementById('faction-badge');
  const f = FACTIONS[G.playerFaction];
  fb.textContent = `${f.name} · ${f.leader}`;
  fb.style.background = getFactionColor(G.playerFaction) + '33';
  fb.style.color = getFactionColor(G.playerFaction);
  fb.style.border = `1px solid ${getFactionColor(G.playerFaction)}66`;

  document.getElementById('phase-info').textContent = `${G.year}.${G.month} 第${G.turn}回 ${getPlayerCities().length}/${CITY_DEF.length}城`;
}

function updateUI() {
  updateMap();
  updateTopBar();
  if (selectedCityId) renderCityPanel(selectedCityId);
}

/* ════════════════════════════════════════════════════════════
   UI — Attack Modal
════════════════════════════════════════════════════════════ */
function promptAttack(fromId, toId) {
  const atk = G.cities[fromId];
  const def = G.cities[toId];
  const maxSend = atk.troops;

  showModal(
    `⚔ 攻打 ${def.name}`,
    `
    <div style="font-size:14px;margin-bottom:12px;line-height:1.7">
      <b>${atk.name}</b> 可用兵力：<b>${atk.troops}</b><br>
      <b>${def.name}</b> 守備：${def.troops} 兵，城防 ${def.defense}
    </div>
    <div style="margin-bottom:12px">
      <div style="font-size:13px;margin-bottom:6px">出兵數量：<b id="troops-val">${Math.floor(maxSend*0.6)}</b></div>
      <input type="range" id="troops-slider" min="200" max="${maxSend}" step="1" value="${Math.floor(maxSend*0.6)}" oninput="document.getElementById('troops-val').textContent=this.value">
    </div>
    <div style="font-size:12px;color:var(--muted)">提示：兵力與主將統率影響勝負，攻城有一定風險。</div>
    `,
    () => {
      const send = parseInt(document.getElementById('troops-slider').value, 10);
      doAttack(fromId, toId, send);
    }
  );
}

/* ════════════════════════════════════════════════════════════
   UI — Modal
════════════════════════════════════════════════════════════ */
function showModal(title, bodyHTML, onConfirm) {
  document.getElementById('modal-title').textContent = title;
  document.getElementById('modal-body').innerHTML = bodyHTML;
  document.getElementById('modal-overlay').classList.remove('hidden');
  pendingAction = onConfirm;
}

function hideModal() {
  document.getElementById('modal-overlay').classList.add('hidden');
  pendingAction = null;
}

/* ════════════════════════════════════════════════════════════
   UI — Log
════════════════════════════════════════════════════════════ */
function addLog(msg) {
  G.log.push(msg);
  // Desktop log bar
  const bar = document.getElementById('log-bar');
  const div = document.createElement('div');
  div.textContent = msg;
  bar.appendChild(div);
  bar.scrollTop = bar.scrollHeight;
  // Mobile log panel
  const pb = document.getElementById('log-panel-body');
  if (pb) {
    const d = document.createElement('div');
    d.textContent = msg;
    pb.appendChild(d);
    pb.scrollTop = pb.scrollHeight;
  }
  if (G.log.length > 300) G.log.shift();
}

/* ════════════════════════════════════════════════════════════
   UI — Result
════════════════════════════════════════════════════════════ */
function showResult(win, desc) {
  console.log(sessionStorage.getItem('gameState'));
  sessionStorage.removeItem('gameState');
  console.log(sessionStorage.getItem('gameState'));
  const s = document.getElementById('result-screen');
  s.classList.remove('hidden');
  document.getElementById('result-emoji').textContent = win ? '🏆' : '💀';
  document.getElementById('result-title').textContent = win ? '天下統一！' : '勢力滅亡';
  document.getElementById('result-desc').textContent = desc;
}

function toggleLogPanel() {
  document.getElementById('log-panel').classList.toggle('open');
  // close sidebar if open
  document.getElementById('sidebar').classList.remove('open');
}

/* ════════════════════════════════════════════════════════════
   BOOTSTRAP
════════════════════════════════════════════════════════════ */
// Dynamically build faction select grid
(function buildFactionGrid() {
    // read sessionStorage for saved game state
  if (sessionStorage.getItem('gameState')) {
    G = JSON.parse(sessionStorage.getItem('gameState'));
    document.getElementById('start-screen').style.display = 'none';
    document.getElementById('app').classList.remove('hidden');
    buildMap();
    updateUI();
    const logs = [...G.log];
    G.log = [];
    logs.forEach(addLog);
    return;
  }
  const grid = document.getElementById('faction-select-grid');

  // 難度係數滑桿
  const diff = document.createElement('div');
  diff.style.cssText = 'margin:0 auto 16px;max-width:360px;text-align:center';
  diff.innerHTML = `
    <div style="font-size:13px;margin-bottom:6px">
      難度係數：<b id="difficulty-val">0.5</b>
      <span style="color:var(--muted);font-size:11px">（AI 內政效果 ×<span id="difficulty-mult">1.5</span>）</span>
    </div>
    <input type="range" id="difficulty-slider" min="0" max="1" step="0.1" value="0.5" style="width:100%">
  `;
  grid.parentNode.insertBefore(diff, grid);
  const slider = diff.querySelector('#difficulty-slider');
  slider.addEventListener('input', () => {
    diff.querySelector('#difficulty-val').textContent = slider.value;
    diff.querySelector('#difficulty-mult').textContent = (1 + parseFloat(slider.value)).toFixed(1);
  });
  Object.entries(FACTIONS).forEach(([key, f]) => {
    const btn = document.createElement('button');
    btn.className = 'faction-btn';
    btn.dataset.f = key;
    btn.style.borderColor = f.color + 'aa';
    btn.innerHTML = `
      <span class="flag" style="display:block;width:12px;height:12px;background:${f.color};border-radius:50%;margin-bottom:4px"></span>
      <strong>${f.leader}</strong>
      <div class="desc">${f.name}・起於${CITY_DEF.find(c=>c.id===f.startCity)?.name || f.startCity}</div>
    `;
    btn.addEventListener('click', () => {
      document.getElementById('start-screen').style.display = 'none';
      document.getElementById('app').classList.remove('hidden');
      initGame(key);
      buildMap();
      updateUI();
    });
    grid.appendChild(btn);
  });
})();

document.getElementById('end-turn-btn').addEventListener('click', () => {
  if (!G || G.gameover) return;
  endTurn();
});

document.getElementById('surrender-btn').addEventListener('click', () => {
  if (!G || G.gameover) return;
  showModal('確認投降？','你確定要投降嗎？', () => {
    surrender();
  });
});

document.getElementById('modal-confirm').addEventListener('click', () => {
  if (pendingAction) pendingAction();
  hideModal();
});
document.getElementById('modal-cancel').addEventListener('click', hideModal);
</script>
